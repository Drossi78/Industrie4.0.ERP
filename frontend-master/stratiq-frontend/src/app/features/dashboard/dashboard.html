<div class="app-layout flex flex-col">
  <app-navbar />
  <div class="page-content flex-1 flex flex-col items-center justify-center">
    <div class="w-full max-w-4xl">
      <h1 class="page-title text-center">{{ 'dashboard.title' | t }}</h1>
      <p class="page-subtitle text-center">{{ 'dashboard.subtitle' | t }}</p>

      <div class="mt-10 grid grid-cols-3 gap-5">
        @for (area of areas(); track area.route) {
          <a [routerLink]="area.route" class="dashboard-tile fluent-card flex flex-col items-center gap-4 p-8 no-underline">
            <div class="flex items-center justify-center w-14 h-14 rounded-[var(--radius-control)] bg-primary-soft text-primary">
              <app-area-icon [icon]="area.icon" sizeClass="size-7" />
            </div>
            <div class="text-center">
              <div class="text-base font-semibold text-text">{{ area.labelKey | t }}</div>
              <div class="mt-1 text-sm text-text-muted">{{ area.descKey | t }}</div>
            </div>
          </a>
        }
      </div>
   </div>
</div>
</div>
