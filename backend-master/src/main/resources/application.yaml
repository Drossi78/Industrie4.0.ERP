server:
  port: ${PORT:8080}
  max-http-header-size: 16KB
spring:
  application:
    name: backend
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    # open-in-view=true (default): enables lazy-loading during view rendering. Warning is expected.
  flyway:
    enabled: false   # Schema is managed by Supabase CLI (supabase/migrations/)

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://drossi78.github.io,http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  invoicing:
    vat-rate: 0.19 # German standard VAT rate (Regelsteuersatz)
