    PageMetadata:
      type: object
      description: Standard Spring Data `Page<T>` JSON envelope
      properties:
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        size: { type: integer }
        number: { type: integer, description: Current page index (zero-based) }
        numberOfElements: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
