<app-navbar [showBack]="true" />
<div class="page-shell">
  <div class="flex items-start justify-between">
    <div>
      <h1 class="page-title">{{ 'invoices.title' | t }}</h1>
      <p class="page-subtitle">{{ 'invoices.subtitle' | t }}</p>
    </div>
    @if (canCreate()) {
      <button class="fluent-button-primary" (click)="openCreate()">{{ 'invoices.new.action' | t }}</button>
    }
  </div>

  <div class="mt-8">
    <app-data-table
      [columns]="columns"
      [filters]="filterDefs()"
      [page]="page()"
      [loading]="loading()"
      (queryChange)="onQuery($event)"
      (rowClick)="openInvoice($event)"
    />
  </div>
</div>

@if (showCreate()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" (click)="closeCreate()"></div>

    <div class="relative z-10 fluent-card w-full max-w-lg p-6 overflow-y-auto max-h-[90vh]">
      <h2 class="text-lg font-semibold text-text mb-6">{{ 'invoices.new.title' | t }}</h2>

      <form [formGroup]="createForm" (ngSubmit)="submitCreate()" novalidate class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">
            {{ 'invoices.new.order' | t }} <span class="text-danger">*</span>
          </label>
          <select
            formControlName="orderId"
            class="w-full rounded-[var(--radius-control)] border border-border bg-surface px-3 py-2 text-sm text-text focus:outline-none focus:ring-2 focus:ring-primary/40"
          >
            <option value="">{{ 'invoices.new.orderNone' | t }}</option>
            @for (o of orders(); track o.id) {
              <option [value]="o.id">{{ o.orderNumber ?? o.id }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">
            {{ 'invoices.new.dueDate' | t }}
          </label>
          <input
            formControlName="dueDate"
            type="date"
            class="w-full rounded-[var(--radius-control)] border border-border bg-surface px-3 py-2 text-sm text-text focus:outline-none focus:ring-2 focus:ring-primary/40"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-text-muted mb-1">
            {{ 'invoices.new.notes' | t }}
          </label>
          <textarea
            formControlName="notes"
            rows="2"
            class="w-full rounded-[var(--radius-control)] border border-border bg-surface px-3 py-2 text-sm text-text focus:outline-none focus:ring-2 focus:ring-primary/40 resize-none"
          ></textarea>
        </div>

        @if (createError(); as err) {
          <p class="text-sm text-danger">{{ err | t }}</p>
        }

        <div class="flex justify-end gap-3 mt-2">
          <button
            type="button"
            (click)="closeCreate()"
            class="rounded-[var(--radius-control)] px-4 py-2 text-sm font-medium text-text-muted hover:bg-surface-muted transition-colors"
          >
            {{ 'invoices.new.cancel' | t }}
          </button>
          <button
            type="submit"
            [disabled]="creating()"
            class="fluent-button-primary disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none"
          >
            @if (creating()) {
              <svg class="size-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            }
            {{ 'invoices.new.submit' | t }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
