openapi: 3.0.3
info:
  title: Stratiq Backend API
  version: "0.0.1"
  description: >
    REST API for Stratiq inventory & order management.

    Covers user/role/permission administration, inventory (items, categories,
    suppliers, batches, bills of material), warehouse & stock management
    (movements, goods receipt/issue, transfers, reservations), sales/purchase
    orders with invoicing, production step tracking, and audit logging.

    Authentication is JSON Web Token (JWT) based: call `POST /api/auth/login`
    to obtain an `accessToken`, then send it as `Authorization: Bearer <token>`
    on all subsequent requests. Endpoints are additionally protected by
    fine-grained authorities (e.g. `inventory:read`, `warehouse:write`,
    `admin:access`) assigned to a user's role — see the Permissions section.
  contact:
    name: Stratiq Team
servers:
  - url: http://localhost:8080
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Login, token refresh and password change
  - name: Users
    description: User account administration
  - name: Roles
    description: Role administration (bundles of permissions)
  - name: Permissions
    description: System permission definitions (read-only, immutable)
  - name: Warehouses
    description: Physical/logical storage locations
  - name: Stock
    description: Stock levels, goods receipt/issue, transfers, adjustments and difference reports
  - name: Stock Movements
    description: Low-level, individually addressable stock movement records
  - name: Stock Reservations
    description: Reserve and release stock ahead of fulfillment
  - name: Order Fulfillment
    description: Book stock movements for an order's items
  - name: Items
    description: Purchased parts and own-manufactured products
  - name: Categories
    description: Item categorization
  - name: Suppliers
    description: Vendors that supply purchased items
  - name: Batches
    description: Lot/batch tracking for items (FEFO/FIFO)
  - name: Bill of Materials
    description: Components required to manufacture an own-product item
  - name: Customers
    description: Customer master data
  - name: Orders
    description: Sales (OUT) and purchase (IN) orders
  - name: Order Items
    description: Line items belonging to an order
  - name: Invoices
    description: Invoices generated for orders
  - name: Production Steps (Templates)
    description: Reusable production step templates defined per item
  - name: Order Production Steps
    description: Concrete production steps instantiated for an order's line items
  - name: Production Dashboard
    description: Aggregated view of in-progress production orders
  - name: Audit Logs
    description: Read-only log of create/update/delete actions across the system

paths:
  # ============================= AUTH =============================
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation failed (blank username/password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bad credentials

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          description: Refresh token invalid, expired, or not a refresh token

  # ============================= USERS =============================
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: >
        If `active=true` is passed, returns a flat list of active users.
        Otherwise returns a paginated result.
      security: [{ bearerAuth: [user:read] }]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/UserResponse' }
                  - $ref: '#/components/schemas/PageOfUserResponse'
    post:
      tags: [Users]
      summary: Create a user
      security: [{ bearerAuth: [user:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID
      security: [{ bearerAuth: [user:read] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update a user
      security: [{ bearerAuth: [user:write] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
    delete:
      tags: [Users]
      summary: Delete a user
      security: [{ bearerAuth: [user:delete] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }

  /api/v1/users/{id}/role:
    put:
      tags: [Users]
      summary: Assign a role to a user
      security: [{ bearerAuth: [user:write] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserChangeRoleRequest' }
      responses:
        '200':
          description: Role assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }

  # ============================= ROLES =============================
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List all roles
      security: [{ bearerAuth: [user:read] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleResponse' }
    post:
      tags: [Roles]
      summary: Create a role
      security: [{ bearerAuth: [admin:access] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }

  /api/v1/roles/{id}:
    get:
      tags: [Roles]
      summary: Get a role by ID
      security: [{ bearerAuth: [user:read] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Roles]
      summary: Update a role
      security: [{ bearerAuth: [admin:access] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
    delete:
      tags: [Roles]
      summary: Delete a role
      security: [{ bearerAuth: [admin:access] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }

  /api/v1/roles/{id}/permissions:
    post:
      tags: [Roles]
      summary: Assign permissions to a role
      security: [{ bearerAuth: [admin:access] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionAssignRequest' }
      responses:
        '200':
          description: Permissions assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
    delete:
      tags: [Roles]
      summary: Revoke permissions from a role
      security: [{ bearerAuth: [admin:access] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionAssignRequest' }
      responses:
        '200':
          description: Permissions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }

  # ============================= PERMISSIONS =============================
  /api/v1/permissions:
    get:
      tags: [Permissions]
      summary: List all permissions
      security: [{ bearerAuth: [user:read] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionResponse' }
    post:
      tags: [Permissions]
      summary: Create a permission
      security: [{ bearerAuth: [admin:access] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionResponse' }

  # ============================= WAREHOUSES =============================
  /api/v1/warehouses:
    get:
      tags: [Warehouses]
      summary: List warehouses
      description: Filter by `city` or `active=true`; otherwise returns a paginated list.
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/WarehouseResponse' }
                  - $ref: '#/components/schemas/PageOfWarehouseResponse'
    post:
      tags: [Warehouses]
      summary: Create a warehouse
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }

  /api/v1/warehouses/{id}:
    get:
      tags: [Warehouses]
      summary: Get a warehouse by ID
      security: [{ bearerAuth: [warehouse:read] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Warehouses]
      summary: Update a warehouse
      security: [{ bearerAuth: [warehouse:write] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
    delete:
      tags: [Warehouses]
      summary: Delete a warehouse
      security: [{ bearerAuth: [warehouse:delete] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }

  # ============================= STOCK =============================
  /api/v1/stock:
    get:
      tags: [Stock]
      summary: Stock difference report (alias of /difference-report)
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DifferenceReportResponse' }

  /api/v1/stock/difference-report:
    get:
      tags: [Stock]
      summary: Stock difference report (total IN vs total OUT / balance)
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DifferenceReportResponse' }

  /api/v1/stock/movements:
    get:
      tags: [Stock]
      summary: Paginated list of all stock movements
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfStockMovementResponse' }

  /api/v1/stock/levels:
    get:
      tags: [Stock]
      summary: Stock overview — current balance for every item, summed across warehouses
      security: [{ bearerAuth: [warehouse:read] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockLevelResponse' }

  /api/v1/stock/levels/{itemId}/warehouses:
    get:
      tags: [Stock]
      summary: Per-warehouse breakdown of one item's stock
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WarehouseStockResponse' }

  /api/v1/stock/warehouses/{warehouseId}/levels:
    get:
      tags: [Stock]
      summary: Per-item stock levels within a single warehouse
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: warehouseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockLevelResponse' }

  /api/v1/stock/batches:
    get:
      tags: [Stock]
      summary: Available batches (balance > 0) for an item in a warehouse, ordered FEFO/FIFO
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: itemId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BatchStockResponse' }

  /api/v1/stock/adjustment:
    post:
      tags: [Stock]
      summary: Book a stock adjustment (correct on-hand quantity up or down)
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementResponse' }

  /api/v1/stock/goods-receipt:
    post:
      tags: [Stock]
      summary: "Wareneingang: book an IN movement into a warehouse"
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsReceiptRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementResponse' }
        '409':
          description: Conflict / business rule violation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/stock/goods-issue:
    post:
      tags: [Stock]
      summary: "Warenausgang: book OUT movement(s); auto-allocates across batches (FEFO/FIFO)"
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsIssueRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockMovementResponse' }
        '409':
          description: Insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/stock/transfer:
    post:
      tags: [Stock]
      summary: "Umlagerung: move stock between two warehouses"
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockTransferRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockMovementResponse' }
        '409':
          description: Insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ============================= STOCK MOVEMENTS =============================
  /api/v1/stock-movements:
    get:
      tags: [Stock Movements]
      summary: List stock movements
      description: >
        Filter by `itemId`, `warehouseId`, `orderId`, or `type` (checked in that
        order, first match wins and returns an unpaginated list). With no filter,
        returns a paginated list of all movements.
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: orderId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/StockMovementResponse' }
                  - $ref: '#/components/schemas/PageOfStockMovementResponse'
    post:
      tags: [Stock Movements]
      summary: Create a stock movement directly
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockMovementCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementResponse' }

  /api/v1/stock-movements/{id}:
    get:
      tags: [Stock Movements]
      summary: Get a stock movement by ID
      security: [{ bearerAuth: [warehouse:read] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Stock Movements]
      summary: Update a stock movement
      security: [{ bearerAuth: [warehouse:write] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockMovementUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementResponse' }
    delete:
      tags: [Stock Movements]
      summary: Delete a stock movement
      security: [{ bearerAuth: [warehouse:delete] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }

  # ============================= STOCK RESERVATIONS =============================
  /api/v1/stock/reservations:
    get:
      tags: [Stock Reservations]
      summary: List reservations
      description: Optionally filtered by warehouse, item and status (default ACTIVE).
      security: [{ bearerAuth: [warehouse:read] }]
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReservationStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReservationResponse' }
    post:
      tags: [Stock Reservations]
      summary: Reserve stock
      description: Fails if available stock is insufficient.
      security: [{ bearerAuth: [warehouse:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReservationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }
        '409':
          description: Insufficient available stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/stock/reservations/{id}/release:
    post:
      tags: [Stock Reservations]
      summary: Release an active reservation, freeing the blocked stock
      security: [{ bearerAuth: [warehouse:write] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResponse' }

  # ============================= ORDER FULFILLMENT =============================
  /api/v1/orders/{orderId}/fulfill:
    post:
      tags: [Order Fulfillment]
      summary: Book stock movements for all order items (direction IN or OUT), linked to the order
      security: [{ bearerAuth: [warehouse:write] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderFulfillRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockMovementResponse' }

  # ============================= ITEMS =============================
  /api/v1/items:
    get:
      tags: [Items]
      summary: List items
      description: >
        Filter by `categoryId` or `kind` (checked in that order, first match wins);
        with no filter returns all items.
      security: [{ bearerAuth: [inventory:read] }]
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ItemKind' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
