        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderProductionStepCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderProductionStepResponse' }

  /api/v1/order-production-steps/{id}:
    get:
      tags: [Order Production Steps]
      summary: Get an order production step by ID
      security: [{ bearerAuth: [production:read] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderProductionStepResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Order Production Steps]
      summary: Update an order production step
      security: [{ bearerAuth: [production:write] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderProductionStepUpdateRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderProductionStepResponse' }
    delete:
      tags: [Order Production Steps]
      summary: Delete an order production step
      security: [{ bearerAuth: [production:delete] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '204': { description: Deleted }

  # ============================= PRODUCTION DASHBOARD =============================
  /api/v1/production/orders:
    get:
      tags: [Production Dashboard]
      summary: List active production orders with progress summary
      security: [{ bearerAuth: [production:read] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductionOrderSummaryResponse' }

  /api/v1/production/orders/{id}:
    get:
      tags: [Production Dashboard]
      summary: Get production detail for one order, including assets and their steps
      security: [{ bearerAuth: [production:read] }]
      parameters: [{ $ref: '#/components/parameters/IdParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionOrderDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/production/steps/{stepId}:
    patch:
      tags: [Production Dashboard]
      summary: Patch a production step's status/assignment from the dashboard
      description: >
        `warehouseId` is required when this patch completes the last step of an
        order line: it is the target warehouse for the finished good's stock-IN.
      security: [{ bearerAuth: [production:write] }]
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionStepPatchRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderProductionStepResponse' }

  # ============================= AUDIT LOGS =============================
  /api/v1/audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries
      description: Filter by `userId`, or by `entityType` + `entityId` together; otherwise returns all entries.
      security: [{ bearerAuth: [audit:read] }]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageOfAuditLogResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtain a token via `POST /api/auth/login`. Send it as
        `Authorization: Bearer <accessToken>`. Endpoints additionally require
        the listed authority (permission codename) on the caller's role.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      description: Zero-based page index
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, default: 20 }
    SortParam:
      name: sort
      in: query
      description: "Sort field and direction, e.g. `createdAt,desc`"
      schema: { type: string }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---------- Shared ----------
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }

    Unit:
      type: string
      description: Measurement unit for items, order lines and BOM quantities
      enum: [piece, kg, g, l, ml, m, cm, m2, m3, hour, day, set]

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        rfidUid: { type: string, nullable: true }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64, description: Milliseconds until access token expiry }
        username: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: Authority codenames granted to the user's role

    TokenRefreshRequest:
      type: object
      properties:
        refreshToken: { type: string }

    TokenRefreshResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64 }

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 6, maxLength: 100 }

    # ---------- Users / Roles / Permissions ----------
    PermissionCode:
      type: string
      description: Authority codenames used across the API (see security requirements per endpoint)
      enum:
        - inventory:read
        - inventory:write
        - inventory:delete
        - order:read
        - order:write
        - order:delete
        - customer:read
        - customer:write
        - customer:delete
        - warehouse:read
        - warehouse:write
        - warehouse:delete
        - production:read
        - production:write
        - production:delete
        - user:read
        - user:write
        - user:delete
        - audit:read
        - admin:access

    UserCreateRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        roleId: { type: string, format: uuid }
        preferredLang: { type: string, example: de }

    UserUpdateRequest:
      type: object
      properties:
        email: { type: string, format: email }
        roleId: { type: string, format: uuid }
        preferredLang: { type: string }
        isActive: { type: boolean }

    UserChangeRoleRequest:
      type: object
      properties:
        roleId: { type: string, format: uuid }

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        email: { type: string, format: email }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        preferredLang: { type: string }
        isActive: { type: boolean }

    RoleCreateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    RoleUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    RoleResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionResponse' }

    PermissionAssignRequest:
      type: object
      properties:
        permissionIds:
          type: array
          items: { type: string, format: uuid }

    PermissionCreateRequest:
      type: object
      properties:
        name: { type: string }
        codename: { type: string }

    PermissionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        codename: { type: string }

    # ---------- Warehouses ----------
    WarehouseCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string }
        street: { type: string, maxLength: 255 }
        houseNumber: { type: string, maxLength: 20 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        isActive: { type: boolean }

    WarehouseUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string }
        street: { type: string, maxLength: 255 }
        houseNumber: { type: string, maxLength: 20 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        isActive: { type: boolean }

    WarehouseResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: string }
        street: { type: string }
        houseNumber: { type: string }
        zipCode: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        isActive: { type: boolean }

    # ---------- Stock / Movements ----------
    MovementType:
      type: string
      enum: [IN, OUT, TRANSFER]

    ReservationStatus:
      type: string
      description: >
        ACTIVE blocks available stock. RELEASED was cancelled without being
        consumed. FULFILLED was consumed by production completion.
      enum: [ACTIVE, RELEASED, FULFILLED]

    AdjustmentRequest:
      type: object
      required: [itemId, warehouseId, quantity]
      properties:
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, description: May be negative or positive }
        note: { type: string, maxLength: 255 }

    GoodsReceiptRequest:
      type: object
      required: [itemId, warehouseId, quantity]
      description: >
        If batchNumber is set, the movement is booked onto that lot (created if
        new); leave it null for untracked stock. expiryDate only applies when a
        new batch is created.
      properties:
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
        batchNumber: { type: string, maxLength: 100 }
        expiryDate: { type: string, format: date-time }
        note: { type: string, maxLength: 255 }
        orderId: { type: string, format: uuid }

    GoodsIssueRequest:
      type: object
      required: [itemId, warehouseId, quantity]
      description: >
        If batchId is set, stock is taken from that specific lot. Otherwise it
        is allocated automatically across batches FEFO-then-FIFO, possibly
        spanning several lots.
      properties:
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
        batchId: { type: string, format: uuid }
        note: { type: string, maxLength: 255 }
        orderId: { type: string, format: uuid }

    StockTransferRequest:
      type: object
      required: [itemId, fromWarehouseId, toWarehouseId, quantity]
      description: Booked as an OUT in the source and an IN in the target warehouse.
      properties:
        itemId: { type: string, format: uuid }
        fromWarehouseId: { type: string, format: uuid }
        toWarehouseId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 255 }

    StockMovementCreateRequest:
      type: object
      required: [quantity, type, itemId, warehouseId]
      properties:
        note: { type: string, maxLength: 255 }
        quantity: { type: integer, format: int64 }
        type: { type: string, maxLength: 255, description: "e.g. IN, OUT, TRANSFER" }
        itemId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }

    StockMovementUpdateRequest:
      type: object
      properties:
        note: { type: string, maxLength: 255 }
        quantity: { type: integer, format: int64 }
        type: { type: string, maxLength: 255 }
        itemId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }

    StockMovementResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        note: { type: string }
        quantity: { type: integer, format: int64 }
        type: { type: string }
        itemId: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        warehouseId: { type: string, format: uuid }
        batchId: { type: string, format: uuid, nullable: true }
        batchNumber: { type: string, nullable: true, description: "Human-readable batch info, null for untracked movements" }
        expiryDate: { type: string, format: date-time, nullable: true }

    StockLevelResponse:
      type: object
      description: Current stock level for a single item, summed across all warehouses. balance = totalIn - totalOut.
      properties:
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        totalIn: { type: integer, format: int64 }
        totalOut: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }

    WarehouseStockResponse:
      type: object
      description: Stock level of one item broken down for a single warehouse.
      properties:
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string }
        totalIn: { type: integer, format: int64 }
        totalOut: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }

    DifferenceReportResponse:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string }
        totalIn: { type: integer, format: int64 }
        totalOut: { type: integer, format: int64 }
        balance: { type: integer, format: int64 }

    BatchStockResponse:
      type: object
      description: Derived available stock of a single batch for an item in a warehouse.
      properties:
        batchId: { type: string, format: uuid }
        batchNumber: { type: string }
        expiryDate: { type: string, format: date-time, nullable: true }
        balance: { type: integer, format: int64 }

    CreateReservationRequest:
      type: object
      required: [itemId, warehouseId, quantity]
      description: Reserve a quantity of an item in a warehouse. Fails if available stock is insufficient.
      properties:
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        quantity: { type: integer, format: int64, minimum: 1 }
        note: { type: string, maxLength: 255 }
        orderId: { type: string, format: uuid }

    ReservationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string }
        quantity: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        note: { type: string }
        orderId: { type: string, format: uuid, nullable: true }
        releasedAt: { type: string, format: date-time, nullable: true }

    OrderFulfillRequest:
      type: object
      required: [direction]
      description: >
        direction "IN" is a goods receipt (requires warehouseId). direction
        "OUT" is a goods issue, auto-allocated across warehouses (warehouseId
        optional/ignored). batchLines is optional per-item batch metadata,
        only applied for direction IN.
      properties:
        warehouseId: { type: string, format: uuid }
        direction: { type: string, enum: [IN, OUT] }
        batchLines:
          type: array
          items:
            type: object
            description: "Batch info for one order item's goods receipt. batchNumber blank/null = untracked."
            properties:
              itemId: { type: string, format: uuid }
              batchNumber: { type: string }
              expiryDate: { type: string, format: date-time }

    # ---------- Inventory ----------
    ItemKind:
      type: string
      enum: [OWN_PRODUCT, PURCHASED]

    ItemCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        categoryId: { type: string, format: uuid }
        unit: { type: string }
        price: { type: number, format: decimal }
        description: { type: string }
        notes: { type: string }

    ItemUpdateRequest:
      type: object
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        categoryId: { type: string, format: uuid }
        unit: { type: string }
        price: { type: number, format: decimal }
        description: { type: string }
        notes: { type: string }

    ItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        categoryId: { type: string, format: uuid, nullable: true }
        categoryName: { type: string, nullable: true }
        unit: { type: string }
        price: { type: number, format: decimal }
        description: { type: string }
        notes: { type: string }
        isDeleted: { type: boolean }

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        description: { type: string, maxLength: 255 }

    CategoryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        description: { type: string }

    SupplierCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        taxId: { type: string, maxLength: 50 }
        street: { type: string, maxLength: 255 }
        houseNumber: { type: string, maxLength: 20 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        notes: { type: string }

    SupplierUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        taxId: { type: string, maxLength: 50 }
        street: { type: string, maxLength: 255 }
        houseNumber: { type: string, maxLength: 20 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        notes: { type: string }

    SupplierResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        taxId: { type: string }
        street: { type: string }
        houseNumber: { type: string }
        zipCode: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        notes: { type: string }

    BatchCreateRequest:
      type: object
      description: A batch is metadata only. Stock enters via a goods receipt (IN movement), not here.
      properties:
        batchNumber: { type: string }
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        expiryDate: { type: string, format: date-time }

    BatchUpdateRequest:
      type: object
      description: A batch is metadata only. Stock is adjusted via stock movements, not here.
      properties:
        batchNumber: { type: string }
        itemId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        expiryDate: { type: string, format: date-time }

    BatchResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        batchNumber: { type: string }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string }
        expiryDate: { type: string, format: date-time, nullable: true }
        currentStock: { type: number, format: decimal, description: "Derived from movements: SUM(IN) - SUM(OUT)" }

    BomCreateRequest:
      type: object
      description: Component must be of kind PURCHASED — no nested/sub-assembly BOMs.
      properties:
        itemId: { type: string, format: uuid, description: Parent item (manufactured OWN_PRODUCT) }
        componentId: { type: string, format: uuid, description: Component item (the part needed) }
        quantity: { type: number, format: decimal, description: Quantity of component needed per parent item }
        unit: { type: string }
        notes: { type: string }

    BomResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        componentId: { type: string, format: uuid }
        componentName: { type: string }
        quantity: { type: number, format: decimal }
        unit: { type: string }
        notes: { type: string }

    # ---------- Orders ----------
    OrderStatus:
      type: string
      description: "Lifecycle: DRAFT → CONFIRMED → COMPLETED (or CANCELLED at any stage)."
      enum: [DRAFT, CONFIRMED, CANCELLED, COMPLETED]

    OrderDirection:
      type: string
      description: Whether fulfilling this order books stock IN (goods receipt/procurement) or OUT (goods issue/sale).
      enum: [IN, OUT]

    InvoiceStatus:
      type: string
      description: "Lifecycle: ISSUED → PAID (or CANCELLED)."
      enum: [ISSUED, PAID, CANCELLED]

    CustomerCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        taxId: { type: string, maxLength: 50 }
        street: { type: string, maxLength: 255 }
        houseNumber: { type: string, maxLength: 20 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        notes: { type: string }

    CustomerUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        taxId: { type: string, maxLength: 50 }
        street: { type: string, maxLength: 255 }
        houseNumber: { type: string, maxLength: 20 }
        zipCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        country: { type: string, maxLength: 100 }
        notes: { type: string }

    CustomerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        taxId: { type: string }
        street: { type: string }
        houseNumber: { type: string }
        zipCode: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        notes: { type: string }

    OrderCreateRequest:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        orderNumber: { type: string, maxLength: 50 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        direction: { $ref: '#/components/schemas/OrderDirection' }
        orderDate: { type: string, format: date-time }
        expectedDate: { type: string, format: date-time }
        totalAmount: { type: number, format: decimal }
        notes: { type: string }

    OrderUpdateRequest:
      type: object
      properties:
        customerId: { type: string, format: uuid }
        orderNumber: { type: string, maxLength: 50 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        expectedDate: { type: string, format: date-time }
        totalAmount: { type: number, format: decimal }
        notes: { type: string }

    OrderResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        customerId: { type: string, format: uuid, nullable: true }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        direction: { $ref: '#/components/schemas/OrderDirection' }
        orderDate: { type: string, format: date-time }
        expectedDate: { type: string, format: date-time, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        totalAmount: { type: number, format: decimal }
        notes: { type: string }

    OrderItemCreateRequest:
      type: object
      required: [orderId, itemId, itemName, unit, quantity, unitPrice]
      properties:
        orderId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemName: { type: string, maxLength: 255 }
        unit: { $ref: '#/components/schemas/Unit' }
        quantity: { type: number, format: decimal, minimum: 0.001 }
        unitPrice: { type: number, format: decimal, minimum: 0 }
        notes: { type: string }
        supplierId: { type: string, format: uuid }

    OrderItemUpdateRequest:
      type: object
      properties:
        itemName: { type: string, maxLength: 255 }
        unit: { $ref: '#/components/schemas/Unit' }
        quantity: { type: number, format: decimal, minimum: 0.001 }
        unitPrice: { type: number, format: decimal, minimum: 0 }
        notes: { type: string }
        supplierId: { type: string, format: uuid }

    OrderItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        orderId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        unit: { $ref: '#/components/schemas/Unit' }
        quantity: { type: number, format: decimal }
        unitPrice: { type: number, format: decimal }
        lineTotal: { type: number, format: decimal }
        notes: { type: string }
        supplierId: { type: string, format: uuid, nullable: true }

    InvoiceCreateRequest:
      type: object
      required: [orderId]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issueDate: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        notes: { type: string }

    InvoiceUpdateRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        dueDate: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time }
        subtotal: { type: number, format: decimal }
        taxAmount: { type: number, format: decimal }
        totalAmount: { type: number, format: decimal }
        notes: { type: string }

    InvoiceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        invoiceNumber: { type: string }
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issueDate: { type: string, format: date-time, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        subtotal: { type: number, format: decimal }
        taxAmount: { type: number, format: decimal }
        totalAmount: { type: number, format: decimal }
        notes: { type: string }

    # ---------- Production ----------
    ProductionStepStatus:
      type: string
      description: "Workflow: PENDING → IN_PROGRESS → DONE."
      enum: [PENDING, IN_PROGRESS, DONE]

    ProductionStepCreateRequest:
      type: object
      required: [itemId, name, stepOrder]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        description: { type: string }
        stepOrder: { type: integer, minimum: 1 }
        notes: { type: string }

    ProductionStepUpdateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string }
        stepOrder: { type: integer, minimum: 1 }
        notes: { type: string }
        isDeleted: { type: boolean }

    ProductionStepResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        itemId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        stepOrder: { type: integer }
        isDeleted: { type: boolean }
        notes: { type: string }

    OrderProductionStepCreateRequest:
      type: object
      required: [orderId, orderItemId, templateStepId, name, stepOrder]
      properties:
        orderId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        templateStepId: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        description: { type: string }
        stepOrder: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ProductionStepStatus' }
        assignedTo: { type: string, format: uuid }

    OrderProductionStepUpdateRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ProductionStepStatus' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        assignedTo: { type: string, format: uuid }
        description: { type: string }

    OrderProductionStepResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        orderId: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        templateStepId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        stepOrder: { type: integer }
        status: { $ref: '#/components/schemas/ProductionStepStatus' }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        assignedTo: { type: string, format: uuid, nullable: true }

    ProductionStepPatchRequest:
      type: object
      description: >
        Partial update from the dashboard. `assignedTo` explicitly set to null
        removes the assignment (distinct from the key being absent).
      properties:
        status: { $ref: '#/components/schemas/ProductionStepStatus' }
        assignedTo: { type: string, format: uuid, nullable: true }
        warehouseId:
          type: string
          format: uuid
          description: Required when this patch completes the last step of an order line.

    ProductionOrderSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        customerName: { type: string }
        orderDate: { type: string, format: date-time }
        totalSteps: { type: integer }
        completedSteps: { type: integer }
        progressPercent: { type: integer }

    ProductionOrderDetailResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        customerName: { type: string }
        assets:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              itemName: { type: string }
              quantity: { type: number, format: decimal }
              totalSteps: { type: integer }
              completedSteps: { type: integer }
              steps:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    stepOrder: { type: integer }
                    status: { $ref: '#/components/schemas/ProductionStepStatus' }
                    assignedTo:
                      type: object
                      nullable: true
                      properties:
                        id: { type: string, format: uuid }
                        email: { type: string }
                    startedAt: { type: string, format: date-time, nullable: true }
                    completedAt: { type: string, format: date-time, nullable: true }

    # ---------- Audit ----------
    AuditLogResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        userId: { type: string, format: uuid, nullable: true }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        action: { type: string }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }

    # ---------- Page<T> wrappers (Spring Data JSON shape) ----------
    PageOfUserResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/UserResponse' }

    PageOfWarehouseResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/WarehouseResponse' }

    PageOfStockMovementResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/StockMovementResponse' }

    PageOfCategoryResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CategoryResponse' }

    PageOfSupplierResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/SupplierResponse' }

    PageOfCustomerResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/CustomerResponse' }

    PageOfOrderResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/OrderResponse' }

    PageOfOrderItemResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/OrderItemResponse' }

    PageOfInvoiceResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/InvoiceResponse' }

    PageOfProductionStepResponse:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
